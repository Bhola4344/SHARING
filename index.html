<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Photo Sync - Mobile to Desktop</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 15px;
}

.container {
    max-width: 480px;
    margin: auto;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
}

.upload-box {
    border: 2px dashed #2563eb;
    padding: 18px;
    border-radius: 14px;
    background: #f8fafc;
    cursor: pointer;
}

.upload-box:hover {
    background: #e0ecff;
}

input[type="file"] {
    display: none;
}

.gallery {
    margin-top: 15px;
}

.photo-card {
    background: #fff;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 14px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
}

.photo-card img {
    width: 100%;
    border-radius: 10px;
}

.btn-group {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.download-btn { background: #22c55e; }
.delete-btn { background: #ef4444; }
.copy-btn { background: #f59e0b; }

</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>📸 Live Photo Sync</h2>
<p>Mobile se photo khicho — Desktop me turant dikhega</p>

<label class="upload-box">
📷 Tap to Capture Photo
<input type="file" id="photoInput" accept="image/*" capture="environment">
</label>

<div class="gallery" id="gallery"></div>

</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>

// STEP 1: Paste your Firebase config here
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "XXXX",
    appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);

const storage = firebase.storage();
const db = firebase.firestore();

const input = document.getElementById('photoInput');
const gallery = document.getElementById('gallery');

// Auto upload when photo taken
input.addEventListener('change', async function () {

    try {

    const file = input.files[0];

    if (!file) return;

    const fileName = Date.now() + "_" + file.name;

    const storageRef = storage.ref('photos/' + fileName);

    await storageRef.put(file);

    const url = await storageRef.getDownloadURL();

    await db.collection('photos').add({
        url: url,
        created: new Date()
    });

    input.value = "";

    } catch (error) {
        console.error(error);
        alert('Upload failed. Firebase config ya internet check karo.');
    }

});

// Real-time listener (mobile + desktop both)
db.collection('photos')
.orderBy('created', 'desc')
.onSnapshot(snapshot => {

    gallery.innerHTML = '';

    snapshot.forEach(doc => {

        const data = doc.data();

        const card = document.createElement('div');
        card.className = 'photo-card';

        const img = document.createElement('img');
        img.src = data.url;

        const btnGroup = document.createElement('div');
        btnGroup.className = 'btn-group';

        const downloadBtn = document.createElement('a');
        downloadBtn.href = data.url;
        downloadBtn.download = 'photo.jpg';
        downloadBtn.innerText = '⬇ Download';
        downloadBtn.className = 'btn download-btn';

        const copyBtn = document.createElement('button');
        copyBtn.innerText = '📋 Copy';
        copyBtn.className = 'btn copy-btn';

        copyBtn.onclick = async function () {

            const response = await fetch(data.url);
            const blob = await response.blob();

            await navigator.clipboard.write([
                new ClipboardItem({ [blob.type]: blob })
            ]);

            copyBtn.innerText = '✅ Copied';

            setTimeout(() => {
                copyBtn.innerText = '📋 Copy';
            }, 1500);

        };

        const deleteBtn = document.createElement('button');
        deleteBtn.innerText = '❌ Delete';
        deleteBtn.className = 'btn delete-btn';

        deleteBtn.onclick = async function () {

            await db.collection('photos').doc(doc.id).delete();

        };

        btnGroup.appendChild(downloadBtn);
        btnGroup.appendChild(copyBtn);
        btnGroup.appendChild(deleteBtn);

        card.appendChild(img);
        card.appendChild(btnGroup);

        gallery.appendChild(card);

    });

});

</script>

</body>
</html>
